## Split keyboards
## https://zmk.dev/docs/config/system#split-keyboards
CONFIG_ZMK_SPLIT=y
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2
CONFIG_ZMK_USB=y

# Receive each half's existing BAS reports (normally once per 60 seconds).
# This supplies internal battery events; text printing is configured separately.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

# X and Y arrive as separate notifications, together with both halves' keys.
# Keep BLE bursts while the input/USB worker drains the previous report.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_POSITION_QUEUE_SIZE=32
CONFIG_INPUT_QUEUE_MAX_MSGS=32

# Short-range split link: allow automatic 2M PHY negotiation with the right.
# Peripherals without 2M support (including the existing left image) use 1M.
CONFIG_BT_CTLR_PHY_2M=y

