name: Build and Release ZMK Firmware
on:
  push:
    branches: [main]
    tags: ['v1.0.1']
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.matrix.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - run: python -m pip install PyYAML
      - id: matrix
        shell: bash
        run: echo "groups=$(python scripts/generate_matrix.py)" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.combo.name }})
    needs: setup
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        combo: ${{ fromJson(needs.setup.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate firmware
        shell: bash
        env:
          KEYMAP: ${{ matrix.combo.keymap }}
          FORMAT: ${{ matrix.combo.format }}
        run: bash local-build/build_single.sh "$KEYMAP" "$FORMAT"
      - uses: actions/upload-artifact@v4
        with:
          name: charybdis-${{ matrix.combo.name }}
          path: ${{ matrix.combo.artifact_path }}
          if-no-files-found: error

  release-firmware:
    name: Release Firmware
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: combo-artifacts/
      - name: Zip each combo
        working-directory: combo-artifacts
        run: |
          for d in */; do
            zip -j "${d%/}.zip" "$d"*
          done
      - uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Firmware Release ${{ github.ref_name }}
          files: combo-artifacts/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
